<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#F64000" media="(prefers-color-scheme: light)" />
        <meta name="description" content="SoulPrint Engine Pro — your company's AI crew." />
        <!--
          Client-side Content Security Policy. The platform's edge
          server doesn't let us set this as a real HTTP header, so we
          fall back to <meta http-equiv> which browsers DO enforce for
          the directives below (default-src, script-src, style-src,
          img-src, etc). Note: `frame-ancestors`, `report-uri`, and
          `report-to` are spec-required to be ignored when set via
          meta — for those we'd need real HTTP headers, which on this
          platform requires a Cloudflare Transform Rule or equivalent
          edge-level config (see Trust & Security page roadmap).
          Permissive on `'unsafe-inline'`/`'unsafe-eval'` because the
          React dev shim and a handful of inline-style libraries need
          them; we'll tighten as we verify each dependency.
        -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://apis.google.com https://www.googletagmanager.com https://customer-assets.emergentagent.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss: ws:; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
        <meta http-equiv="X-Content-Type-Options" content="nosniff" />
        <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <!--
          `default` = the iPhone status bar stays opaque with a solid
          background, and web content starts BELOW it. `black-translucent`
          causes content to render UNDER the status bar, which overlapped
          the landing-page nav even with safe-area-inset padding applied.
          Note: iOS caches this meta at PWA install time, so users who
          installed before Feb 4 2026 need to remove + re-add the home-
          screen shortcut to pick up the change.
        -->
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="SoulPrint" />
        <link rel="manifest" href="/manifest.json" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
        <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
        <link rel="apple-touch-icon" sizes="512x512" href="/favicon-512.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
        <title>SoulPrint Engine Pro</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script>
          // Register the service worker only in production builds — avoids
          // cache-thrash and stale assets while developing.
          if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
              navigator.serviceWorker.register("/sw.js").catch(function () {});
            });
          }
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
